# Pre-commit hooks for 1c-oData-skill
#
# Installation:
#   pip install -e ".[dev]"
#   pre-commit install
#   pre-commit install --hook-type commit-msg
#
# Manual run:
#   pre-commit run --all-files

repos:
  # Ruff — lint + format (replaces flake8, isort, black)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
        types_or: [python, pyi]
      - id: ruff-format
        types_or: [python, pyi]

  # Mypy — static type checking (same paths as CI)
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.20.2
    hooks:
      - id: mypy
        args: [bot/, bot_lib/, mcp_servers/]
        pass_filenames: false
        additional_dependencies:
          - pydantic>=2.0
          - httpx>=0.27.0
          - pandas>=2.0

  # Conventional Commits — commit-msg hook
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v3.6.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]

  # General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: ^(processing/|\.cache/|logs/)
      - id: trailing-whitespace
        exclude: ^(processing/|\.cache/|logs/)
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-yaml
        exclude: ^(processing/)
      - id: check-json
      - id: check-toml
      - id: no-commit-to-branch
        args: [--branch, main, --branch, develop]
        stages: [pre-commit]

  # Changelog required when application code changes
  - repo: local
    hooks:
      - id: check-changelog
        name: check-changelog
        entry: python scripts/check_changelog.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
